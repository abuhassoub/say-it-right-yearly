<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>*,*::before,*::after{box-sizing:border-box}html,body{margin:0}[hidden]{display:none!important}</style></head><body><title>Say It Right</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Noto+Sans:wght@400;600&display=swap">
<style>
/* Layout: header with accent and language switches, three tabs.
   Sounds tab = grid of sound pairs above one practice panel of word cards.
   British vs American tab = one row per word with both IPA forms side by side. */
:root{
  --ui:'Cairo','Segoe UI',Tahoma,'Noto Sans Arabic',sans-serif;
  --ipa:'Noto Sans','Charis SIL','Doulos SIL','Segoe UI','DejaVu Sans',sans-serif;
  --bg:#F4F6F9; --surface:#FFFFFF; --surface-2:#EAEFF6; --ink:#14213D; --muted:#4B5870; --line:#D3DBE6;
  --accent:#0B6E79; --on-accent:#FFFFFF;
  --uk:#2B4C9B; --on-uk:#FFFFFF; --us:#A84A06; --on-us:#FFFFFF;
  --good:#17683F; --warn:#8F4400; --bad:#B3261E; --bad-solid:#B3261E; --on-bad:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1623; --surface:#172033; --surface-2:#1F2A41; --ink:#E8EDF7; --muted:#A9B5CB; --line:#2C3956;
    --accent:#4FC3CF; --on-accent:#08222A;
    --uk:#9DB3F7; --on-uk:#0F1623; --us:#F4AA62; --on-us:#0F1623;
    --good:#6FD7A3; --warn:#F4AA62; --bad:#FF9C94; --bad-solid:#C2352C; --on-bad:#FFFFFF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1623; --surface:#172033; --surface-2:#1F2A41; --ink:#E8EDF7; --muted:#A9B5CB; --line:#2C3956;
  --accent:#4FC3CF; --on-accent:#08222A;
  --uk:#9DB3F7; --on-uk:#0F1623; --us:#F4AA62; --on-us:#0F1623;
  --good:#6FD7A3; --warn:#F4AA62; --bad:#FF9C94; --bad-solid:#C2352C; --on-bad:#FFFFFF;
  color-scheme: dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.6}
.wrap{max-width:980px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app[data-accent="uk"]{--acc:var(--uk);--on-acc:var(--on-uk)}
.app[data-accent="us"]{--acc:var(--us);--on-acc:var(--on-us)}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between}
.brand{min-width:0;flex:1 1 280px}
.brand h1{margin:0;font-size:28px;line-height:1.25;font-weight:700;text-wrap:balance}
.brand p{margin:2px 0 0;color:var(--muted);font-size:15px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:3px;gap:2px}
.seg button{min-height:44px;padding:0 16px;border:0;border-radius:9px;background:transparent;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.seg button[data-v="uk"][aria-pressed="true"]{background:var(--uk);color:var(--on-uk)}
.seg button[data-v="us"][aria-pressed="true"]{background:var(--us);color:var(--on-us)}
.langbtn{min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-weight:600;cursor:pointer}
.voices{margin:12px 0 0;font-size:13.5px;color:var(--muted)}
.voices.warn{color:var(--warn)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:18px;overflow-x:auto}
.tab{min-height:48px;padding:0 16px;background:none;border:0;border-bottom:3px solid transparent;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

.hint{margin:16px 0 0;color:var(--muted);font-size:15px}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px;margin-top:10px}
.set{min-height:64px;padding:8px 6px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:center;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:0}
.set .sym{font-family:var(--ipa);font-size:20px;font-weight:600;direction:ltr;unicode-bidi:isolate;line-height:1.3}
.set .lab{font-size:12.5px;color:var(--muted);direction:ltr;unicode-bidi:isolate}
.set[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}

.panel{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:18px}
.panel h2{margin:0;font-size:22px;line-height:1.3;text-wrap:balance}
.facts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.fact{background:var(--surface-2);border-radius:12px;padding:12px 14px;min-width:0}
.fact h3{margin:0 0 4px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fact p{margin:0;font-size:15.5px}
.banner{border:1px solid var(--warn);border-radius:12px;padding:12px 14px;color:var(--warn);font-size:15px;background:var(--surface)}
.caveat{margin:0;font-size:13.5px;color:var(--muted)}

.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px}
.card{background:var(--surface-2);border-radius:12px;padding:14px;min-width:0}
.cardhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.w{font-family:var(--ipa);font-size:28px;font-weight:600;direction:ltr;unicode-bidi:isolate;line-height:1.3}
.ipa{font-family:var(--ipa);font-size:18px;color:var(--acc);direction:ltr;unicode-bidi:isolate}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{min-height:44px;min-width:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn svg{flex:none}
.btn.say{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.say.on{background:var(--bad-solid);border-color:var(--bad-solid);color:var(--on-bad)}
.btn.say.on .dot{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){.btn.say.on .dot{animation:none}}
.status{margin-top:10px;min-height:1.6em;font-size:15px;display:flex;gap:8px;align-items:flex-start}
.status:empty{min-height:0;margin-top:0}
.micbar{margin-top:12px;flex-wrap:wrap;align-items:center;gap:8px 12px}
.micbar .btn{margin-inline-start:auto}
.micbar .how{flex-basis:100%;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.micbar .how ol{margin:6px 0 0;padding-inline-start:22px}
.micbar .how li{margin:2px 0}
.groups{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.gbtn{min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-weight:600;cursor:pointer}
.gbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ghead{margin:14px 0 -2px;font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.status svg{flex:none;margin-top:3px}
.status .q{font-family:var(--ipa);direction:ltr;unicode-bidi:isolate;font-weight:600}
.status.good{color:var(--good)} .status.warn{color:var(--warn)} .status.bad{color:var(--bad)} .status.info{color:var(--muted)}

.ablist{display:grid;gap:10px;margin-top:16px}
.ab{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px}
.ab .forms{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:8px}
.form{background:var(--surface-2);border-radius:10px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.form .tag{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.form.uk .tag,.form.uk .ipa{color:var(--uk)} .form.us .tag,.form.us .ipa{color:var(--us)}
.note{margin:0;font-size:15px;color:var(--muted)}

.plist{display:grid;gap:10px;margin-top:16px}
.prow{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px}
.prow .head{display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:space-between;align-items:center}
.prow .name{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.bar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.sum{margin:16px 0 0;font-size:16px}
.reset{margin-top:16px}
</style>

<div class="wrap">
  <div class="app" id="app" data-accent="uk"></div>
</div>
<input id="fileIn" type="file" accept="audio/*" capture hidden>

<script>
window.__startApp=function(){
'use strict';

/* ---------- Content ---------- */
const W=(w,uk,us)=>({w:w,uk:uk,us:us||uk});

const SETS=[
{id:'pb',sym:'p · b',
 title:{en:'/p/ and /b/',ar:'الصوتان /p/ و /b/'},
 why:{en:'Arabic has no /p/, so it is often replaced by /b/ (pen sounds like ben).',
      ar:'اللغة العربية ليس فيها صوت /p/، فيُنطق غالبًا /b/ (فتصير pen كأنها ben).'},
 tip:{en:'/p/ is voiceless and aspirated: say it with a puff of air. Hold a tissue in front of your mouth; it should move for pat but hardly for bat. Touch your throat: /b/ vibrates, /p/ does not.',
      ar:'صوت /p/ مهموس ويخرج معه نفَس قوي. ضع ورقة خفيفة أمام فمك، فيجب أن تتحرك مع pat ولا تكاد تتحرك مع bat. المس حنجرتك: صوت /b/ مجهور فتشعر باهتزاز، أما /p/ فلا اهتزاز فيه.'},
 pairs:[[W('pat','pæt'),W('bat','bæt')],[W('pie','paɪ'),W('buy','baɪ')],[W('pack','pæk'),W('back','bæk')],
        [W('rope','rəʊp','roʊp'),W('robe','rəʊb','roʊb')],[W('cap','kæp'),W('cab','kæb')]]},
{id:'fv',sym:'f · v',
 title:{en:'/f/ and /v/',ar:'الصوتان /f/ و /v/'},
 why:{en:'Arabic has /f/ but no /v/, so /v/ is often replaced by /f/ (very sounds like ferry).',
      ar:'في العربية صوت /f/ ولا يوجد /v/، فيُنطق /v/ غالبًا /f/ (فتصير very كأنها ferry).'},
 tip:{en:'For /v/, touch your upper teeth to your lower lip as for /f/, but switch your voice on. You should feel a buzz on your lip.',
      ar:'عند نطق /v/ ضع أسنانك العليا على الشفة السفلى كما في /f/، لكن شغّل الصوت. يجب أن تشعر بطنين على شفتك.'},
 pairs:[[W('fan','fæn'),W('van','væn')],[W('feel','fiːl'),W('veal','viːl')],[W('safe','seɪf'),W('save','seɪv')],
        [W('leaf','liːf'),W('leave','liːv')],[W('ferry','ˈferi'),W('very','ˈveri')]]},
{id:'ii',sym:'ɪ · iː',
 title:{en:'/ɪ/ and /iː/',ar:'الصوتان /ɪ/ و /iː/'},
 why:{en:'In Arabic, short and long vowels differ only in length. English /ɪ/ and /iː/ differ in length and in quality, so learners often use one vowel for both (ship sounds like sheep).',
      ar:'في العربية يختلف الصوت القصير عن الطويل في المدة فقط. أما /ɪ/ و/iː/ في الإنجليزية فيختلفان في المدة وفي الجودة، فيستعمل المتعلمون صوتًا واحدًا لهما (فتصير ship كأنها sheep).'},
 tip:{en:'/ɪ/ is short and relaxed: the tongue is lower and the lips are loose. /iː/ is longer and tenser, with the lips spread as in a smile.',
      ar:'صوت /ɪ/ قصير ومسترخٍ، واللسان أخفض والشفتان مرتخيتان. أما /iː/ فأطول وأشد توترًا، والشفتان ممدودتان كالابتسامة.'},
 pairs:[[W('ship','ʃɪp'),W('sheep','ʃiːp')],[W('sit','sɪt'),W('seat','siːt')],[W('live','lɪv'),W('leave','liːv')],
        [W('bit','bɪt'),W('beat','biːt')],[W('fill','fɪl'),W('feel','fiːl')]]},
{id:'ae',sym:'æ · e',
 title:{en:'/æ/ and /e/',ar:'الصوتان /æ/ و /e/'},
 why:{en:'Many Arabic speakers merge /æ/ and /e/ (bad sounds like bed).',
      ar:'يخلط كثير من المتحدثين بالعربية بين /æ/ و/e/ (فتصير bad كأنها bed).'},
 tip:{en:'For /æ/ open your mouth wide and lower your jaw; for /e/ the mouth is more closed. Look in a mirror: the gap between your teeth should be bigger for bad than for bed.',
      ar:'في /æ/ افتح فمك واسعًا واخفض فكّك، وفي /e/ يكون الفم أقل انفتاحًا. انظر في مرآة: يجب أن تكون المسافة بين أسنانك في bad أكبر منها في bed.'},
 pairs:[[W('bad','bæd'),W('bed','bed')],[W('man','mæn'),W('men','men')],[W('pan','pæn'),W('pen','pen')],[W('sat','sæt'),W('set','set')]]},
{id:'ua',sym:'ʌ · æ',
 title:{en:'/ʌ/ and /æ/',ar:'الصوتان /ʌ/ و /æ/'},
 why:{en:'/ʌ/ does not exist in Arabic and is often replaced by /a/ or /æ/ (cup sounds like cap).',
      ar:'صوت /ʌ/ غير موجود في العربية، فيُبدَّل غالبًا بـ /a/ أو /æ/ (فتصير cup كأنها cap).'},
 tip:{en:'/ʌ/ is short and relaxed and comes from the middle of the mouth. Do not open your jaw wide as you do for /æ/.',
      ar:'صوت /ʌ/ قصير ومرتخٍ، يخرج من وسط الفم. لا تفتح فكّك واسعًا كما تفعل في /æ/.'},
 pairs:[[W('cup','kʌp'),W('cap','kæp')],[W('luck','lʌk'),W('lack','læk')],[W('hut','hʌt'),W('hat','hæt')],[W('cut','kʌt'),W('cat','kæt')]]},
{id:'th',sym:'θ · ð',
 title:{en:'The “th” sounds',ar:'صوتا “th”'},
 why:{en:'Standard Arabic has these sounds (ث and ذ), but in everyday speech many Arabic speakers replace them with /s/, /t/, /z/ or /d/. Then think sounds like sink or tink.',
      ar:'للعربية الفصحى هذان الصوتان (ث وذ)، لكن في الكلام اليومي يُبدلهما كثيرون بـ /s/ و/t/ و/z/ و/d/، فتصير think كأنها sink أو tink.'},
 tip:{en:'Put the tip of your tongue lightly between your teeth and let the air flow. /θ/ is the sound of ث, and /ð/ is the sound of ذ. Do not press the tongue (that gives /t/ or /d/) and do not pull it back (that gives /s/ or /z/).',
      ar:'ضع طرف لسانك بين أسنانك برفق ودع الهواء يمر. /θ/ هو صوت ث، و/ð/ هو صوت ذ. لا تضغط اللسان (فيصير /t/ أو /d/) ولا تسحبه إلى الخلف (فيصير /s/ أو /z/).'},
 pairs:[[W('think','θɪŋk'),W('sink','sɪŋk')],[W('three','θriː'),W('tree','triː')],[W('thank','θæŋk'),W('tank','tæŋk')],
        [W('then','ðen'),W('den','den')],[W('breathe','briːð'),W('breeze','briːz')],[W('mouth','maʊθ'),W('mouse','maʊs')]]},
{id:'rl',sym:'r · l',
 title:{en:'/r/ and /l/',ar:'الصوتان /r/ و /l/'},
 why:{en:'Arabic ر is a tap or a trill. English /r/ is smooth and the tongue touches nothing. Some learners also blur /r/ and /l/.',
      ar:'الراء العربية نقرة أو تكرار للسان. أما /r/ الإنجليزي فسلس ولا يلمس اللسان فيه شيئًا. ويخلط بعض المتعلمين بين /r/ و/l/.'},
 tip:{en:'For /r/, curl the tip of the tongue back without touching the roof of the mouth, round your lips slightly, and do not roll it. For /l/, the tongue tip touches the ridge behind the upper teeth.',
      ar:'في /r/ اعطف طرف اللسان إلى الخلف دون أن يلمس سقف الفم، وقرّب شفتيك قليلًا، ولا تكرّر الراء. وفي /l/ يلمس طرف اللسان اللثة خلف الأسنان العليا.'},
 pairs:[[W('right','raɪt'),W('light','laɪt')],[W('red','red'),W('led','led')],[W('rice','raɪs'),W('lice','laɪs')],
        [W('road','rəʊd','roʊd'),W('load','ləʊd','loʊd')],[W('rock','rɒk','rɑːk'),W('lock','lɒk','lɑːk')]]},
{id:'ng',sym:'ŋ · n',
 title:{en:'/ŋ/ and /n/',ar:'الصوتان /ŋ/ و /n/'},
 why:{en:'Learners often say /n/ instead of /ŋ/ (sin for sing), or add a /g/ after it (sing-g).',
      ar:'يقول المتعلمون غالبًا /n/ بدل /ŋ/ (sin بدل sing)، أو يضيفون /g/ بعده (sing-g).'},
 tip:{en:'For /ŋ/ the back of the tongue touches the soft palate and the air goes through the nose. Stop at that sound and do not add a /g/.',
      ar:'في /ŋ/ يلمس مؤخر اللسان الحنك الرخو ويخرج الهواء من الأنف. قف عند هذا الصوت ولا تضف /g/ بعده.'},
 pairs:[[W('sing','sɪŋ'),W('sin','sɪn')],[W('thing','θɪŋ'),W('thin','θɪn')],[W('king','kɪŋ'),W('kin','kɪn')],[W('wing','wɪŋ'),W('win','wɪn')]]},
{id:'wv',sym:'w · v',
 title:{en:'/w/ and /v/',ar:'الصوتان /w/ و /v/'},
 why:{en:'Arabic has /w/ (و) but no /v/, so learners may say /w/ or /f/ for /v/.',
      ar:'للعربية صوت /w/ (و) ولا يوجد /v/، فقد يقول المتعلمون /w/ أو /f/ بدل /v/.'},
 tip:{en:'For /w/, round your lips and keep your teeth away from them. For /v/, your upper teeth touch your lower lip.',
      ar:'في /w/ استدِر بشفتيك وأبعد أسنانك عنهما. وفي /v/ تلمس أسنانك العليا شفتك السفلى.'},
 pairs:[[W('west','west'),W('vest','vest')],[W('wine','waɪn'),W('vine','vaɪn')],[W('wet','wet'),W('vet','vet')],
        [W('worse','wɜːs','wɝːs'),W('verse','vɜːs','vɝːs')]]},
{id:'sh',sym:'ʃ · tʃ',
 title:{en:'/ʃ/ and /tʃ/',ar:'الصوتان /ʃ/ و /tʃ/'},
 why:{en:'Arabic has ش (/ʃ/) but /tʃ/ is not a regular sound of Standard Arabic, so chip may sound like ship.',
      ar:'للعربية صوت ش (/ʃ/)، لكن /tʃ/ ليس صوتًا أصيلًا في الفصحى، فقد تصير chip كأنها ship.'},
 tip:{en:'/tʃ/ starts with a stop, like /t/, and then releases into /ʃ/: “t” plus “sh” in one quick movement.',
      ar:'يبدأ /tʃ/ بانحباس كالتاء ثم ينطلق إلى /ʃ/، أي «ت» ثم «ش» في حركة واحدة سريعة.'},
 pairs:[[W('ship','ʃɪp'),W('chip','tʃɪp')],[W('sheep','ʃiːp'),W('cheap','tʃiːp')],[W('share','ʃeə','ʃer'),W('chair','tʃeə','tʃer')],[W('shin','ʃɪn'),W('chin','tʃɪn')]]},
{id:'jg',sym:'dʒ · g',
 title:{en:'/dʒ/ and /g/',ar:'الصوتان /dʒ/ و /g/'},
 why:{en:'In Egyptian Arabic the letter ج is pronounced /g/, so /dʒ/ often becomes /g/ (jet sounds like get).',
      ar:'في اللهجة المصرية يُنطق حرف الجيم /g/، فيصير /dʒ/ غالبًا /g/ (فتصير jet كأنها get).'},
 tip:{en:'/dʒ/ is the voiced partner of /tʃ/: a stop that releases into /ʒ/. The front of the tongue touches the ridge behind the upper teeth, not the back of the tongue as for /g/.',
      ar:'/dʒ/ هو المقابل المجهور لـ /tʃ/: انحباس ثم انطلاق إلى /ʒ/. يلمس مقدّم اللسان اللثة خلف الأسنان العليا، لا مؤخره كما في /g/.'},
 pairs:[[W('jet','dʒet'),W('get','get')],[W('jail','dʒeɪl'),W('gale','geɪl')],[W('jeer','dʒɪə','dʒɪr'),W('gear','gɪə','gɪr')],[W('edge','edʒ'),W('egg','eg')]]},
{id:'cl',sym:'sk · str',type:'words',
 title:{en:'Consonant clusters',ar:'تجمّعات الأصوات الساكنة'},
 why:{en:'Arabic words do not begin with two consonants, so learners add a vowel: school becomes iskool, plan becomes pilan.',

 tip:{en:'Do not add a vowel before or inside the cluster. Say s-kool, not is-kool. Hold the /s/ and move straight to the next consonant.',
      ar:'لا تضف حركة قبل التجمّع أو داخله. قل s-kool وليس is-kool. أبقِ /s/ مستمرًا وانتقل مباشرة إلى الصامت التالي.'},

/* ---------- Microphone permission (asked when the page starts) ---------- */
/* A web page cannot open the phone's settings itself. It asks the browser for the microphone
   (which shows the system permission box), and when the answer is "blocked" it shows the exact
   path to the right setting for this device. */
function platform(){
  const ua=navigator.userAgent||'';
  const ipad=/Macintosh/.test(ua)&&navigator.maxTouchPoints>1;
  if(/iPhone|iPad|iPod/.test(ua)||ipad)return /CriOS|FxiOS|EdgiOS|OPiOS/.test(ua)?'iosOther':'iosSafari';
  if(/Android/i.test(ua))return 'android';
  return 'desk';
}
const STEPS={android:'micAndroid',iosSafari:'micIosSafari',iosOther:'micIosOther',desk:'micDesk'};
function micApi(){return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);}
function micMissing(){setMic(window.isSecureContext===false?'insecure':'unavailable');}
function paintMic(){
  const el=document.getElementById('micBar'); if(!el)return;
  if(state.micBlocked){el.className='';el.innerHTML='';return;}
  const m=state.mic; let kind='info',ic='info',msg=tx('micAsk'),btn='',steps='';
  if(m==='granted'){kind='good';ic='check';msg=tx('micOn');}
  else if(m==='asking'){msg=tx('micAsking');}
  else if(m==='denied'){
    kind='bad';ic='alert';msg=tx('micDenied');btn=tx('micTry');
    steps='<div class="how"><strong>'+tx('micHow')+'</strong><ol>'+tx(STEPS[platform()]).split('|').map(function(t){return '<li>'+t+'</li>';}).join('')+'</ol></div>';
  }
  else if(m==='insecure'){kind='warn';ic='alert';msg=tx('micInsecure');}
  else if(m==='unavailable'){kind='warn';ic='alert';msg=tx('micNone');}
  else if(m==='unknown'){btn=tx('micEnable');}
  el.className='micbar status '+kind;
  el.innerHTML=icon(ic)+'<span>'+msg+'</span>'+(btn?'<button class="btn say" type="button" data-act="mic" data-id="mic">'+icon('mic')+btn+'</button>':'')+steps;
}
function setMic(m){state.mic=m;paintMic();}
async function askMic(){
  if(state.micBlocked)return;
  if(!micApi()){micMissing();return;}
  setMic('asking');
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true});
    st.getTracks().forEach(function(t){t.stop();});
    setMic('granted');
  }catch(e){
    setMic(e&&(e.name==='NotAllowedError'||e.name==='SecurityError')?'denied':'unavailable');
  }
}
async function initMic(){
  if(state.micBlocked)return;
  if(!micApi()){micMissing();return;}
  try{
    if(navigator.permissions&&navigator.permissions.query){
      const p=await navigator.permissions.query({name:'microphone'});
      p.onchange=function(){if(p.state==='granted')setMic('granted');else if(p.state==='denied')setMic('denied');};
      if(p.state==='granted'){setMic('granted');return;}
      if(p.state==='denied'){setMic('denied');return;}
    }
  }catch(e){}
  askMic();
}

/* ---------- Speech output ---------- */
const hasTts='speechSynthesis' in window&&typeof SpeechSynthesisUtterance!=='undefined';
function pickVoice(acc){
  if(!hasTts)return {voice:null,exact:false,any:false};
  const want=acc==='uk'?'en-GB':'en-US';
  const vs=(speechSynthesis.getVoices()||[]).filter(v=>/^en/i.test((v.lang||'').replace('_','-')));
  const exact=vs.filter(v=>(v.lang||'').replace('_','-').toLowerCase()===want.toLowerCase());
  if(exact.length){return {voice:exact.find(v=>v.localService)||exact[0],exact:true,any:true};}
  return {voice:vs[0]||null,exact:false,any:vs.length>0};
}
function speak(text,acc,rate){
  if(!hasTts)return false;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang=acc==='uk'?'en-GB':'en-US';
    const p=pickVoice(acc); if(p.voice)u.voice=p.voice;
    u.rate=rate||0.9;
    speechSynthesis.speak(u);
    return true;
  }catch(e){return false;}
}
function voiceLine(){
  const el=document.getElementById('voiceInfo'); if(!el)return;
  if(!hasTts){el.textContent=tx('noTts');el.className='voices warn';return;}
  const p=pickVoice(state.accent);
  const an=state.lang==='ar'?ACC_AR[state.accent]:ACC_EN[state.accent];
  if(p.exact){el.textContent=tx('voiceOk',{a:an,name:p.voice.name});el.className='voices';}
  else if(p.any){el.textContent=tx('voiceFallback',{a:an});el.className='voices warn';}
  else{el.textContent=tx('voiceNone');el.className='voices warn';}
}
if(hasTts){try{speechSynthesis.addEventListener('voiceschanged',voiceLine);}catch(e){}}

/* ---------- Speech check ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let active=null;

function setStatus(key,kind,code,vars){
  state.status[key]={kind:kind,code:code,vars:vars||{}};
  paintStatus(key);
}
function paintStatus(key){
  const el=document.getElementById('st-'+key); if(!el)return;
  const s=state.status[key];
  if(!s){el.className='status';el.innerHTML='';return;}
  const ic=s.kind==='good'?'check':(s.kind==='info'?'info':'alert');
  const v=Object.assign({},s.vars);
  if(v.sound)v.sound='/'+v.sound.split(' · ').join(state.lang==='ar'?'/ و /':'/ and /')+'/';
  let msg=fm(tx(s.code,v));
  msg=msg.replace(/“([^”]*)”|«([^»]*)»/g,function(m,a,b){return (m.charAt(0)==='“'?'“':'«')+'<span class="q">'+(a!==undefined?a:b)+'</span>'+(m.charAt(0)==='“'?'”':'»');});
  el.className='status '+s.kind;
  el.innerHTML=icon(ic)+'<span>'+msg+'</span>';
}
function paintButton(key){
  const b=document.querySelector('[data-act="say"][data-key="'+key+'"]'); if(!b)return;
  const on=state.listening===key;
  b.classList.toggle('on',on);
  b.setAttribute('aria-pressed',on?'true':'false');
  b.innerHTML=on?('<span class="dot">'+icon('stop')+'</span>'+tx('stop')):(icon('mic')+tx('say'));
}
function record(word,ok){
  const s=stats[word]||(stats[word]={a:0,ok:0});
  s.a++; if(ok)s.ok++;
  store.set('sir.stats',JSON.stringify(stats));
}
function judge(target,partner,alts){
  const toks=a=>a.toLowerCase().replace(/[^a-z' ]/g,' ').split(/\s+/).filter(Boolean);
  const top=alts.length?toks(alts[0]):[];
  const all=[].concat.apply([],alts.map(toks));
  if(top.indexOf(target)>-1)return {code:'ok',kind:'good',top:target,ok:true};
  if(all.indexOf(target)>-1)return {code:'near',kind:'warn',top:top.join(' ')||alts[0]};
  if(partner&&top.indexOf(partner)>-1)return {code:'partner',kind:'bad',top:partner};
  if(alts.length)return {code:'other',kind:'bad',top:alts[0]};
  return {code:'none',kind:'warn'};
}
function stopActive(){ if(active){active.cancel();} }

async function startCheck(key,word,partner,soundText){
  if(state.listening===key){ if(active)active.finishNow(); return; }
  stopActive();
  if(hasTts){try{speechSynthesis.cancel();}catch(e){}}
  state.listening=key; paintButton(key);
  setStatus(key,'info','listening',{w:word});

  const ctx={done:false,alts:[],err:null,rec:null,mr:null,stream:null,chunks:[],timer:null,hadRecognizer:false,hadRecorder:false};
  function cleanup(){
    clearTimeout(ctx.timer);
    if(ctx.stream){ctx.stream.getTracks().forEach(t=>t.stop());ctx.stream=null;}
    state.listening=null; active=null; paintButton(key);
  }
  function conclude(){
    if(ctx.done)return; ctx.done=true;
    const finishWith=function(){
      cleanup();
      if(ctx.hadRecognizer&&ctx.alts.length){
        const j=judge(word,partner,ctx.alts);
        record(word,!!j.ok);
        setStatus(key,j.kind,j.code,{top:j.top,w:word,sound:soundText});
        refreshProgress();
      }else if(ctx.err==='not-allowed'||ctx.err==='service-not-allowed'){
        setStatus(key,'bad','denied');
      }else if(ctx.err==='network'){
        setStatus(key,'bad','net');
      }else if(ctx.hadRecognizer){
        setStatus(key,'warn','none');
      }else if(ctx.hadRecorder){
        setStatus(key,'info','noRec');
      }else{
        setStatus(key,'bad','noMic');
      }
      repaintMine(key);
    };
    if(ctx.mr&&ctx.mr.state!=='inactive'){
      ctx.mr.onstop=function(){
        try{
          if(ctx.chunks.length){
            if(state.recUrls[key])URL.revokeObjectURL(state.recUrls[key]);
            state.recUrls[key]=URL.createObjectURL(new Blob(ctx.chunks,{type:ctx.mr.mimeType||'audio/webm'}));
          }
        }catch(e){}
        finishWith();
      };
      try{ctx.mr.stop();}catch(e){finishWith();}
    }else finishWith();
    if(ctx.rec){try{ctx.rec.abort();}catch(e){}}
  }
  active={
    cancel:function(){ctx.done=true;clearTimeout(ctx.timer);
      if(ctx.rec){try{ctx.rec.abort();}catch(e){}}
      if(ctx.mr&&ctx.mr.state!=='inactive'){ctx.mr.onstop=null;try{ctx.mr.stop();}catch(e){}}
      cleanup(); state.status[key]=null; paintStatus(key);},
    finishNow:conclude
  };

  // Recorder (for hearing yourself back)
  if(!state.micBlocked&&navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&typeof MediaRecorder!=='undefined'){
    try{
      const st=await navigator.mediaDevices.getUserMedia({audio:true});
      if(ctx.done){st.getTracks().forEach(function(t){t.stop();});return;}
      ctx.stream=st; if(state.mic!=='granted')setMic('granted');
      ctx.mr=new MediaRecorder(ctx.stream);
      ctx.mr.ondataavailable=function(e){if(e.data&&e.data.size)ctx.chunks.push(e.data);};
      ctx.mr.start(); ctx.hadRecorder=true;
    }catch(err){
      ctx.stream=null; ctx.mr=null;
      if(err&&(err.name==='NotAllowedError'||err.name==='SecurityError')){ctx.err='not-allowed';setMic('denied');}
    }
  }
  if(ctx.done)return;

  // Recognizer (for checking the word)
  if(SR&&ctx.err!=='not-allowed'){
    try{
      const rec=new SR();
      rec.lang=state.accent==='uk'?'en-GB':'en-US';
      rec.interimResults=false; rec.maxAlternatives=5; rec.continuous=false;
      rec.onresult=function(e){
        const r=e.results&&e.results[0]; if(!r)return;
        ctx.alts=[]; for(let i=0;i<r.length;i++)ctx.alts.push(r[i].transcript);
      };
      rec.onerror=function(e){ctx.err=e.error||'error';};
      rec.onend=function(){conclude();};
      rec.start(); ctx.rec=rec; ctx.hadRecognizer=true;
    }catch(e){ctx.rec=null;}
  }
  if(!ctx.hadRecognizer&&!ctx.hadRecorder){ conclude(); return; }
  ctx.timer=setTimeout(conclude,6000);
}

function repaintMine(key){
  const b=document.querySelector('[data-act="mine"][data-key="'+key+'"]');
  if(b)b.hidden=!state.recUrls[key];
}
let player=null;
function playMine(key){
  const u=state.recUrls[key]; if(!u)return;
  try{if(player)player.pause();}catch(e){}
  player=new Audio(u); player.play().catch(function(){});
}
let uploadKey=null;
fileIn.addEventListener('change',function(){
  const f=fileIn.files&&fileIn.files[0]; if(!f||!uploadKey)return;
  const key=uploadKey; uploadKey=null;
  try{
    if(state.recUrls[key])URL.revokeObjectURL(state.recUrls[key]);
    state.recUrls[key]=URL.createObjectURL(f);
    setStatus(key,'info','uploaded'); repaintMine(key);
  }catch(e){}
  fileIn.value='';
});

/* ---------- Views ---------- */
function card(key,w,partner,soundText,scopeAccent){
  const mic=state.micBlocked
    ?'<button class="btn" type="button" data-act="upload" data-key="'+key+'">'+icon('file')+tx('upload')+'</button>'
    :'<button class="btn say" type="button" data-act="say" data-key="'+key+'" data-w="'+w.w+'" data-p="'+(partner||'')+'" data-sound="'+(soundText||'')+'" aria-pressed="false">'+icon('mic')+tx('say')+'</button>';
  return '<div class="card">'
   +'<div class="cardhead"><span class="w" lang="en">'+w.w+'</span><span class="ipa">/'+ipaOf(w)+'/</span></div>'
   +'<div class="acts">'
   +'<button class="btn" type="button" data-act="speak" data-w="'+w.w+'" data-acc="'+state.accent+'" data-rate="0.9">'+icon('speaker')+tx('listen')+'</button>'
   +'<button class="btn" type="button" data-act="speak" data-w="'+w.w+'" data-acc="'+state.accent+'" data-rate="0.5">'+icon('speaker')+tx('slow')+'</button>'
   +mic
   +'<button class="btn" type="button" data-act="mine" data-key="'+key+'"'+(state.recUrls[key]?'':' hidden')+'>'+icon('play')+tx('mine')+'</button>'
   +'</div>'
   +'<div class="status" id="st-'+key+'" role="status" aria-live="polite"></div>'
   +'</div>';
}
function progressOf(set){
  const words=set.type==='words'?set.words:[].concat.apply([],set.pairs);
  let n=0; words.forEach(function(w){if(stats[w.w]&&stats[w.w].ok>0)n++;});
  return {n:n,m:words.length};
}
function soundsView(){
  const set=SETS.find(s=>s.id===state.setId);
  const gbar='<div class="groups" role="group">'+GROUPS.map(function(g){
    return '<button class="gbtn" type="button" data-act="group" data-v="'+g[0]+'" data-id="grp-'+g[0]+'" aria-pressed="'+(set.group===g[0])+'">'+tx(g[1])+'</button>';
  }).join('')+'</div>';
  const chips=SETS.filter(s=>s.group===set.group).map(function(s){
    const p=progressOf(s);
    return '<button class="set" type="button" data-act="set" data-v="'+s.id+'" data-id="set-'+s.id+'" aria-pressed="'+(s.id===state.setId)+'" aria-label="'+bi(s.title)+'">'
      +'<span class="sym">'+s.sym+'</span><span class="lab">'+p.n+' / '+p.m+'</span></button>';
  }).join('');
  const soundText=set.sym;
  let body='';
  if(set.type==='words'){
    body='<div class="pair">'+set.words.map(function(w){return card('s-'+slug(w.w),w,'',soundText);}).join('')+'</div>';
  }else{
    body=set.pairs.map(function(pr){
      return '<div class="pair">'+card('s-'+slug(pr[0].w),pr[0],pr[1].w,soundText)+card('s-'+slug(pr[1].w),pr[1],pr[0].w,soundText)+'</div>';
    }).join('');
  }
  return '<p class="hint">'+tx('hintSounds')+'</p>'
   +gbar
   +'<div class="sets" role="group">'+chips+'</div>'
   +'<section class="panel">'
   +'<h2>'+fm(bi(set.title))+'</h2>'
   +'<div class="facts"><div class="fact"><h3>'+tx('why')+'</h3><p>'+fm(bi(set.why))+'</p></div><div class="fact"><h3>'+tx('tip')+'</h3><p>'+fm(bi(set.tip))+'</p></div></div>'
   +(state.micBlocked?'<div class="banner" role="note">'+tx('blocked')+'</div>':'')
   +body
   +'<p class="caveat">'+tx('caveat')+'</p>'
   +'</section>';
}
function abView(){
  const rows=AB.map(function(it){
    const key='a-'+slug(it.w);
    const mic=state.micBlocked
      ?'<button class="btn" type="button" data-act="upload" data-key="'+key+'">'+icon('file')+tx('upload')+'</button>'
      :'<button class="btn say" type="button" data-act="say" data-key="'+key+'" data-w="'+it.w+'" data-p="" data-sound="" aria-pressed="false">'+icon('mic')+tx('say')+'</button>';
    function form(a){
      return '<div class="form '+a+'"><div><div class="tag">'+tx(a)+'</div><div class="ipa">/'+it[a]+'/</div></div>'
       +'<button class="btn" type="button" data-act="speak" data-w="'+it.w+'" data-acc="'+a+'" data-rate="0.9" aria-label="'+tx('listen')+' – '+tx(a)+'">'+icon('speaker')+tx('listen')+'</button></div>';
    }
    return '<div class="ab"><div class="cardhead"><span class="w" lang="en">'+it.w+'</span></div>'
     +'<div class="forms">'+form('uk')+form('us')+'</div>'
     +'<p class="note"><strong>'+tx('abChange')+':</strong> '+fm(bi(it.note))+'</p>'
     +'<div class="acts">'+mic+'<button class="btn" type="button" data-act="mine" data-key="'+key+'"'+(state.recUrls[key]?'':' hidden')+'>'+icon('play')+tx('mine')+'</button></div>'
     +'<div class="status" id="st-'+key+'" role="status" aria-live="polite"></div></div>';
  }).join('');
  return '<p class="hint">'+tx('abHint')+'</p>'+(state.micBlocked?'<div class="banner" style="margin-top:12px" role="note">'+tx('blocked')+'</div>':'')+'<div class="ablist">'+rows+'</div>';
}
function progView(){
  let total=0,att=0;
  Object.keys(stats).forEach(function(k){att+=stats[k].a;if(stats[k].ok>0)total++;});
  const rows=SETS.map(function(s,i){
    const p=progressOf(s);
    const pct=p.m?Math.round(100*p.n/p.m):0;
    const g=GROUPS.find(x=>x[0]===s.group);
    const head=(i===0||SETS[i-1].group!==s.group)?'<h3 class="ghead">'+tx(g[1])+'</h3>':'';
    return head+'<div class="prow"><div class="head"><div class="name"><strong>'+fm(bi(s.title))+'</strong><span class="ipa">'+s.sym+'</span></div>'
     +'<button class="btn" type="button" data-act="practice" data-v="'+s.id+'">'+tx('progPractice')+'</button></div>'
     +'<div class="bar" role="img" aria-label="'+tx('progOf',{n:p.n,m:p.m})+'"><i style="width:'+pct+'%"></i></div>'
     +'<div class="note">'+(p.n?tx('progOf',{n:p.n,m:p.m}):tx('progNone'))+'</div></div>';
  }).join('');
  return '<p class="sum">'+tx('progSum',{n:total,a:att})+'</p><div class="plist">'+rows+'</div>'
   +'<button class="btn reset" type="button" data-act="reset" data-id="reset">'+(state.clearArmed?tx('clear2'):tx('clear'))+'</button>'
   +'<p class="caveat" style="margin-top:10px">'+tx('progStore')+'</p>';
}
function refreshProgress(){
  document.querySelectorAll('.set').forEach(function(b){
    const s=SETS.find(x=>x.id===b.dataset.v); if(!s)return;
    const p=progressOf(s); const l=b.querySelector('.lab'); if(l)l.textContent=p.n+' / '+p.m;
  });
}
function render(){
  const focusId=document.activeElement&&document.activeElement.getAttribute&&document.activeElement.getAttribute('data-id');
  app.setAttribute('dir',state.lang==='ar'?'rtl':'ltr');
  app.setAttribute('lang',state.lang);
  app.setAttribute('data-accent',state.accent);
  const tabs=[['sounds','tabSounds'],['ab','tabAb'],['prog','tabProg']].map(function(t){
    return '<button class="tab" type="button" role="tab" data-act="tab" data-v="'+t[0]+'" data-id="tab-'+t[0]+'" aria-selected="'+(state.tab===t[0])+'">'+tx(t[1])+'</button>';
  }).join('');
  const view=state.tab==='sounds'?soundsView():(state.tab==='ab'?abView():progView());
  app.innerHTML='<header class="top"><div class="brand"><h1>'+tx('name')+'</h1><p>'+tx('tagline')+'</p></div>'
   +'<div class="controls"><div class="seg" role="group" aria-label="'+tx('accent')+'">'
   +'<button type="button" data-act="accent" data-v="uk" data-id="acc-uk" aria-pressed="'+(state.accent==='uk')+'">'+tx('uk')+'</button>'
   +'<button type="button" data-act="accent" data-v="us" data-id="acc-us" aria-pressed="'+(state.accent==='us')+'">'+tx('us')+'</button></div>'
   +'<button class="langbtn" type="button" data-act="lang" data-id="lang" lang="'+(state.lang==='ar'?'en':'ar')+'">'+tx('langBtn')+'</button></div></header>'
   +'<p class="voices" id="voiceInfo"></p>'
   +'<div id="micBar" role="status" aria-live="polite"></div>'
   +'<div class="tabs" role="tablist">'+tabs+'</div>'
   +'<main id="view">'+view+'</main>';
  voiceLine();
  paintMic();
  Object.keys(state.status).forEach(paintStatus);
  if(focusId){const f=app.querySelector('[data-id="'+focusId+'"]');if(f)f.focus();}
}

/* ---------- Events ---------- */
app.addEventListener('click',function(e){
  const b=e.target.closest('[data-act]'); if(!b)return;
  const d=b.dataset;
  switch(d.act){
    case 'accent': state.accent=d.v; store.set('sir.accent',d.v); stopActive(); state.status={}; render(); break;
    case 'lang': state.lang=state.lang==='ar'?'en':'ar'; store.set('sir.lang',state.lang); stopActive(); render(); break;
    case 'tab': state.tab=d.v; state.clearArmed=false; stopActive(); render(); break;
    case 'group': {const f=SETS.find(x=>x.group===d.v); if(f){state.setId=f.id;store.set('sir.set',f.id);} stopActive(); render(); break;}
    case 'set': state.setId=d.v; store.set('sir.set',d.v); stopActive(); render(); break;
    case 'practice': state.setId=d.v; store.set('sir.set',d.v); state.tab='sounds'; render(); window.scrollTo(0,0); break;
    case 'speak': speak(d.w,d.acc,parseFloat(d.rate)); break;
    case 'say': startCheck(d.key,d.w,d.p,d.sound); break;
    case 'mic': askMic(); break;
    case 'mine': playMine(d.key); break;
    case 'upload': uploadKey=d.key; fileIn.click(); break;
    case 'reset':
      if(!state.clearArmed){state.clearArmed=true;render();}
      else{stats={};store.set('sir.stats','{}');state.clearArmed=false;render();}
      break;
  }
});

render();
initMic();
};
</script>

let lang=st.get('sir.lang')==='en'?'en':'ar';
const t=function(k,v){let s=L[lang][k];if(v)for(const n in v)s=s.split('{'+n+'}').join(v[n]);return s;};
function cookieId(){const m=document.cookie.match(/(?:^|; )sir_dev=([^;]+)/);return m?m[1]:null;}
function getId(){
  let id=st.get('sir.dev')||cookieId();
  if(!id||!ID_RE.test(id)){
    const b=new Uint8Array(12); crypto.getRandomValues(b);
    let s=''; for(let i=0;i<12;i++)s+=ALPHA[b[i]%32];
    id='SIR-'+s.slice(0,4)+'-'+s.slice(4,8)+'-'+s.slice(8,12);
  }
  st.set('sir.dev',id);
  try{document.cookie='sir_dev='+id+'; max-age=315360000; path=/; SameSite=Lax';}catch(e){}
  return id;
}
function unb64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}
/* key = YYYYMMDD "." signature ; valid through the end of that day (UTC) */
const clean=function(s){return String(s||'').replace(/[^A-Za-z0-9_.-]/g,'');};
function parse(key){const m=/^(\d{8})\.([A-Za-z0-9_-]+)$/.exec(key);return m?{exp:m[1],sig:m[2]}:null;}
const endOf=function(exp){return Date.UTC(+exp.slice(0,4),+exp.slice(4,6)-1,+exp.slice(6,8),23,59,59);};
const fmtExp=function(exp){return exp.slice(0,4)+'-'+exp.slice(4,6)+'-'+exp.slice(6,8);};
async function verify(id,p){
  try{
    const sig=unb64u(p.sig); if(sig.length!==64)return false;
    const k=await crypto.subtle.importKey('jwk',PUB,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
    return await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},k,sig,enc.encode('SIR2|'+id+'|'+p.exp));
  }catch(e){return false;}
}
/* Time: the web server's clock when online (cannot be changed on the phone);
   otherwise the device clock, which is not allowed to go back before the last time the app ran. */
async function nowMs(){
  let server=null;
  try{
    const c=new AbortController(); const to=setTimeout(function(){c.abort();},2500);
    const r=await fetch(location.pathname,{method:'HEAD',cache:'no-store',signal:c.signal}); clearTimeout(to);
    const d=r.headers.get('date'); if(d){const v=Date.parse(d); if(!isNaN(v))server=v;}
  }catch(e){}
  const dev=Date.now(), seen=+st.get('sir.seen')||0;
  let n=server!==null?server:dev;
  if(server===null&&dev<seen-86400000)n=seen;
  if(n>seen)st.set('sir.seen',String(n));
  return n;
}

 +'.lock p{margin:0;color:var(--muted);font-size:15px}'

 +'.lock textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:15px/1.5 var(--ipa);padding:10px 12px;direction:ltr;resize:vertical}'

function showLock(id,msgKey,msgDate){
  const app=document.getElementById('app');
  app.setAttribute('dir',lang==='ar'?'rtl':'ltr'); app.setAttribute('lang',lang);
  const secure=!!(window.crypto&&crypto.subtle);
  app.innerHTML='<div class="lock">'
   +'<div class="top"><h1>'+t('name')+'</h1><button class="langbtn" type="button" id="lkLang">'+t('lang')+'</button></div>'
   +'<div class="box"><h2>'+t('lock')+'</h2><p>'+t('lead')+'</p>'
   +(msgKey==='expired'?'<div class="status bad" role="alert">'+t('expired',{d:msgDate})+'</div>':'')+'</div>'
   +(secure?(
    '<div class="box"><h3>'+t('s1')+'</h3><div class="code" id="lkId">'+id+'</div>'
    +'<div class="row"><button class="btn" type="button" id="lkCopy">'+t('copy')+'</button>'
    +'<a class="btn" id="lkWa" target="_blank" rel="noopener" style="text-decoration:none;color:inherit" href="https://wa.me/?text='+encodeURIComponent(t('waMsg').replace('{id}',id))+'">'+t('wa')+'</a></div></div>'
    +'<div class="box"><h3>'+t('s2')+'</h3><textarea id="lkKey" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="'+t('key')+'"></textarea>'
    +'<div class="row"><button class="btn say" type="button" id="lkGo">'+t('act')+'</button></div>'
    +'<div class="status" id="lkSt" role="status" aria-live="polite"></div></div>'
    +'<p>'+t('note')+'</p>'
   ):('<div class="box"><div class="status bad" role="alert">'+t('insecure')+'</div></div>'))
   +'</div>';
  document.getElementById('lkLang').onclick=function(){lang=lang==='ar'?'en':'ar';st.set('sir.lang',lang);showLock(id,msgKey,msgDate);};
  if(!secure)return;
  const stEl=document.getElementById('lkSt');
  function say(kind,key,v){stEl.className='status '+kind;stEl.textContent=t(key,v);}
  document.getElementById('lkCopy').onclick=function(){
    const b=this;
    function done(){b.textContent=t('copied');setTimeout(function(){b.textContent=t('copy');},1500);}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(id).then(done,function(){});}
    else{const r=document.createRange();r.selectNodeContents(document.getElementById('lkId'));const s=getSelection();s.removeAllRanges();s.addRange(r);try{document.execCommand('copy');done();}catch(e){}}
  };
  document.getElementById('lkGo').onclick=async function(){
    const key=clean(document.getElementById('lkKey').value);
    if(!key){say('warn','empty');return;}
    const p=parse(key);
    if(!p||!(await verify(id,p))){say('bad','bad');return;}
    const now=await nowMs();
    if(now>endOf(p.exp)){say('bad','expiredKey',{d:fmtExp(p.exp)});return;}
    st.set(KEYSLOT,key); app.innerHTML=''; start(p,now);
  };
}
function start(p,now){
  const days=Math.max(0,Math.ceil((endOf(p.exp)-now)/86400000));
  let f=document.getElementById('licFoot');
  if(!f){f=document.createElement('p');f.id='licFoot';document.getElementById('app').insertAdjacentElement('afterend',f);}
  f.className='licfoot'+(days<=30?' warn':'');
  f.innerHTML='<span dir="rtl" lang="ar">'+L.ar.foot.replace('{d}',fmtExp(p.exp)).replace('{n}',days)+'</span><span dir="ltr" lang="en">'+L.ar.footEn.replace('{d}',fmtExp(p.exp)).replace('{n}',days)+'</span>';
  window.__startApp();
}
async function boot(){
  if(!(window.crypto&&crypto.subtle)){showLock('',null);return;}
  const id=getId(), saved=clean(st.get(KEYSLOT)), p=parse(saved);
  if(p&&await verify(id,p)){
    const now=await nowMs();
    if(now<=endOf(p.exp)){start(p,now);return;}
    showLock(id,'expired',fmtExp(p.exp));return;
  }
  showLock(id,null);
}
boot();
